<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body> 
  <!-- ===== JOSÉ MARIO: cabeçalho ===== -->
  <header id="cabecalho"></header> 


  <main>
     <!-- ===== PABLO: busca e filtros ===== -->
    <section id="controles"></section> 

    <!-- ===== NICOLAS: lista de cartões ===== --> 
    <section id="lista"></section>

     <!-- ===== MATTEUS: detalhe do item ===== -->
    <aside id="detalhe"></aside>
    <aside id="detalhe" hidden>

    <div class="janela-detalhe" role="dialog"
         aria-modal="true" aria-labelledby="nomeItem">

        <button id="fecharDetalhe" type="button" aria-label="Fechar detalhes">
            X
        </button>

        <img id="imagemItem" alt="Foto do produto">

        <h2 id="nomeItem"></h2>

        <p class="preco-detalhe">
            R$ <span id="precoItem"></span>
        </p>

        <hr>

        <p>
            Categoria:
            <span id="categoriaItem"></span>
        </p>

        <p>
            Vegetariano:
            <span id="vegetarianoItem"></span>
        </p>

        <p>
            Calorias:
            <span id="caloriasItem"></span> kcal
        </p>

        <p>
            Disponibilidade:
            <span id="disponivelItem"></span>
        </p>

        <button id="botaoVoltar" type="button">
            Voltar ao cardápio
        </button>

    </div>

</aside>

  </main> 
  
  <!-- ===== JOSÉ MARIO: rodapé ===== --> 
  <footer id="rodape"></footer> 
  <script src="footer/dados.js">
  </script> <script src="footer/script.js"></script> 
</body>
</html>
